name: Dorm electricity monitor

on:
  schedule:
    # The university page currently exposes data updated at 00:00 each day.
    # UTC 00:17/00:47/01:17 = China time 08:17/08:47/09:17.
    # Later attempts exit immediately after the first successful daily report.
    - cron: "17,47 0 * * *"
    - cron: "17 1 * * *"
  workflow_dispatch:
    inputs:
      send_test_notification:
        description: "Send a Telegram test message before checking meters"
        required: false
        default: false
        type: boolean

permissions:
  # The workflow writes data/history.csv back to the repository.
  contents: write

concurrency:
  group: dorm-electricity-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install chart dependency
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Validate Telegram secrets
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [[ -z "$TELEGRAM_BOT_TOKEN" || -z "$TELEGRAM_CHAT_ID" ]]; then
            echo "::error::Add TELEGRAM_BOT_TOKEN and TELEGRAM_CHAT_ID in repository Actions secrets."
            exit 1
          fi

      - name: Query both meters
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SEND_TEST_NOTIFICATION: ${{ inputs.send_test_notification }}
          DEDUPLICATE_NOTIFICATION: ${{ github.event_name == 'schedule' }}
        run: |
          args=(
            --config config.json
            --output monitor-result.json
            --history data/history.csv
            --chart electricity-history.png
            --notification-state data/notification-state.json
          )
          if [[ "$SEND_TEST_NOTIFICATION" == "true" ]]; then
            args+=(--test-notification)
          fi
          if [[ "$DEDUPLICATE_NOTIFICATION" == "true" ]]; then
            args+=(--deduplicate-notification)
          fi
          python monitor.py "${args[@]}"

      - name: Save daily state
        if: always()
        run: |
          if [[ -z "$(git status --porcelain -- data/history.csv data/notification-state.json)" ]]; then
            echo "No new daily state to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/history.csv data/notification-state.json
          git commit -m "chore: update electricity monitor state [skip ci]"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
